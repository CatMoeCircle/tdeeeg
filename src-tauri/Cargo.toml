[package]
name = "tdeeeg"
version = "0.2.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tdeeeg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }
dotenv = "0.15"

[dependencies]
tauri = { version = "3.0.0-alpha.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-window-state = "3.0.0-alpha.2"
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-fs = "3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
libloading = "0.9.0"
tokio = { version = "1.53.0", features = ["full"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
tauri-plugin-notification = "3.0.0-alpha.3"
notify-rust = "4"
langdetect = { path = "langdetect" }
llmsdk = { version = "0.1", features = ["openai", "anthropic", "utils"] }
# 系统钥匙串：直接用 keyring-core + 平台原生后端（tauri-plugin-keyring-store 仅支持 Tauri 2）
keyring-core = "1"
# 与 llmsdk 用的 reqwest 同大版本（0.13）：LLM 请求要注入自定义 client（不设总超时，见 ai_translate::llm_http_client）
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }

[target.'cfg(windows)'.dependencies]
# Windows 继续走 wry（WebView2），其余平台走 CEF
tauri-runtime-wry = "3.0.0-alpha.5"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-single-instance = "3.0.0-alpha.3"
windows-native-keyring-store = "1"
winreg = "0.56"
tauri-winrt-notification = "0.7"
windows = { version = "0.61", features = [
    "Media",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }

# Linux / macOS：用 CEF（Chromium）运行时，CLI 依据该依赖决定是否打包 CEF
[target.'cfg(not(windows))'.dependencies]
tauri-runtime-cef = "3.0.0-alpha.5"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = "1"
