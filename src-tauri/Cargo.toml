[package]
name = "tdeeeg"
version = "0.2.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tdeeeg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenv = "0.15"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
libloading = "0.9.0"
tokio = { version = "1.53.0", features = ["full"] }
winreg = "0.56"
arboard = "3"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
tauri-plugin-notification = "2"
notify-rust = "4"
langdetect = { path = "langdetect" }
tauri-plugin-keyring-store = { version = "0.2", default-features = false }
# LLM 请求自带 client（连接 / 读取超时见 crate::ai::llm::http_client），不设总超时
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
# 壳标题栏头像 → data URL（base64 编码）
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# 与 tauri/wry 依赖的版本保持一致（wry 0.55 → webview2-com 0.38 / windows 0.61），
# 否则 PlatformWebview::controller() 返回的 COM 接口类型对不上。
webview2-com = "0.38.2"
tauri-plugin-updater = "2.11.0"
tauri-plugin-single-instance = "2"
tauri-winrt-notification = "0.7"
windows = { version = "0.61", features = [
    "Media",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
