name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: 1.0.0)"
        required: true
        type: string
      release_type:
        description: "发布类型"
        required: true
        type: choice
        default: "stable"
        options:
          - stable
          - prerelease
      tdlib_commit_hash:
        description: "TDlib commit hash"
        required: true
        type: string
        default: "v1.8.0"

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version
        id: version
        run: |
          $VERSION = "${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Get release type
        id: release_type
        run: |
          $TYPE = "${{ github.event.inputs.release_type }}"
          echo "type=$TYPE" >> $env:GITHUB_OUTPUT
          if ($TYPE -eq "prerelease") {
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Checkout TDlib
        run: |
          git clone https://github.com/tdlib/td.git
          cd td
          git checkout ${{ github.event.inputs.tdlib_commit_hash }}
        shell: pwsh

      - name: Setup vcpkg
        run: |
          cd td
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          # 安装静态依赖库
          ./vcpkg.exe install gperf:x64-windows-static openssl:x64-windows-static zlib:x64-windows-static
        shell: pwsh

      - name: Build TDlib
        run: |
          cd td
          Remove-Item build -Force -Recurse -ErrorAction SilentlyContinue
          mkdir build
          cd build
          cmake -A x64 -DCMAKE_INSTALL_PREFIX:PATH=../tdlib -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DTD_ENABLE_OPENSSL_STATIC=ON -DTD_ENABLE_ZLIB_STATIC=ON ..
          cmake --build . --target install --config Release
        shell: pwsh

      - name: Copy TDlib.dll to src-tauri/bin
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          Copy-Item td/tdlib/bin/tdlib.dll src-tauri/bin/ -Force
        shell: pwsh

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "TDEEEG v${{ steps.version.outputs.version }}"
          releaseBody: "TDEEEG v${{ steps.version.outputs.version }}"
          releaseDraft: false
          prerelease: ${{ steps.release_type.outputs.prerelease }}
