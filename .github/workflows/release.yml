name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: 1.0.0)"
        required: true
        type: string
      release_type:
        description: "发布类型"
        required: true
        type: choice
        default: "stable"
        options:
          - stable
          - prerelease
      tdlib_commit_hash:
        description: "TDlib commit hash"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version
        id: version
        run: |
          $VERSION = "${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Get release type
        id: release_type
        run: |
          $TYPE = "${{ github.event.inputs.release_type }}"
          echo "type=$TYPE" >> $env:GITHUB_OUTPUT
          if ($TYPE -eq "prerelease") {
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          $prevTag = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -ne 0) {
            # 没有之前的 tag，获取所有提交
            $commits = git log --pretty=format:"- %s (%h)" HEAD
          } else {
            $commits = git log --pretty=format:"- %s (%h)" "$prevTag..HEAD"
          }

          # 构建 release body
          $body = "## TDEEEG v${{ github.event.inputs.version }}`n`n"
          if ($commits) {
            $body += "### 更新内容`n`n$commits"
          } else {
            $body += "### 更新内容`n`n无提交记录"
          }

          # 写入临时文件，供后续步骤读取
          Set-Content -Path "RELEASE_BODY.md" -Value $body -NoNewline
        shell: pwsh

      - name: Read changelog
        id: changelog_read
        run: |
          $body = Get-Content -Path "RELEASE_BODY.md" -Raw
          # 使用 delimiter 语法输出多行值
          echo "body<<EOF" >> $env:GITHUB_OUTPUT
          echo "$body" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Checkout TDlib
        run: |
          git clone https://github.com/tdlib/td.git
          cd td
          git checkout ${{ github.event.inputs.tdlib_commit_hash }}
        shell: pwsh

      # 缓存 TDlib 构建目录和安装目录（按 commit hash + OS + arch）
      - name: Cache TDlib build
        id: cache_tdlib
        uses: actions/cache@v3
        with:
          path: |
            td/build
            td/tdlib
          key: tdlib-${{ github.event.inputs.tdlib_commit_hash }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            tdlib-${{ github.event.inputs.tdlib_commit_hash }}-${{ runner.os }}-
            tdlib-${{ github.event.inputs.tdlib_commit_hash }}-

      # 如果缓存未命中，则执行完整的 TDlib 构建
      - name: Setup vcpkg (if cache miss)
        if: steps.cache_tdlib.outputs.cache-hit != 'true'
        run: |
          cd td
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          ./vcpkg.exe install gperf:x64-windows-static openssl:x64-windows-static zlib:x64-windows-static
        shell: pwsh

      - name: Build TDlib shared library (if cache miss)
        if: steps.cache_tdlib.outputs.cache-hit != 'true'
        run: |
          cd td
          Remove-Item build -Force -Recurse -ErrorAction SilentlyContinue
          mkdir build
          cd build
          cmake -A x64 `
            -DCMAKE_INSTALL_PREFIX:PATH=../tdlib `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DTD_ENABLE_OPENSSL_STATIC=ON `
            -DTD_ENABLE_ZLIB_STATIC=ON `
            -DBUILD_SHARED_LIBS=ON `
            ..
          cmake --build . --target install --config Release
        shell: pwsh

      - name: Copy TDlib.dll to src-tauri/bin
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          Copy-Item td/tdlib/bin/*.dll src-tauri/bin/ -Force
        shell: pwsh

      - name: Verify TDlib DLL
        run: |
          if (Test-Path src-tauri/bin/tdjson.dll) {
            Write-Host "tdjson.dll found in src-tauri/bin"
          } else {
            Write-Host "tdjson.dll NOT found!" -ForegroundColor Red
            exit 1
          }
        shell: pwsh

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "TDEEEG v${{ steps.version.outputs.version }}"
          releaseBody: "${{ steps.changelog_read.outputs.body }}"
          releaseDraft: false
          prerelease: ${{ steps.release_type.outputs.prerelease }}
