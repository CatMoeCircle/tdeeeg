name: Release

# 版本号的唯一来源是 git tag：推 v* tag 即发布，手动触发时也只填 tag 名。
# 构建前由 scripts/set-version.mjs 把 tag 写进 package.json / tauri.conf.json /
# Cargo.toml / Cargo.lock，因此应用内版本、NSIS 安装包名
# tdeeeg_<version>_<arch>-setup.exe 与 updater 的 latest.json 都与 tag 保持一致。
# tag 带 "-"（如 v0.3.0-beta.1）自动标记为 prerelease。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.2.6"
        required: true
        type: string
      tdlib_commit_hash:
        description: "TDlib commit hash（留空则用仓库变量 TDLIB_COMMIT_HASH）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve tag and version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "${{ inputs.tag }}"
          }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            Write-Host "tag 必须形如 v0.2.6 或 v0.3.0-beta.1，当前: '$tag'" -ForegroundColor Red
            exit 1
          }
          $version = $tag.Substring(1)
          $prerelease = if ($tag -match '-') { "true" } else { "false" }
          Write-Host "tag=$tag version=$version prerelease=$prerelease"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Resolve TDlib commit
        id: tdlib
        run: |
          $hash = "${{ inputs.tdlib_commit_hash }}".Trim()
          if (-not $hash) { $hash = "${{ vars.TDLIB_COMMIT_HASH }}".Trim() }
          if (-not $hash) {
            Write-Host "缺少 TDlib commit：请在仓库 Variables 里设置 TDLIB_COMMIT_HASH，或手动触发时填写 tdlib_commit_hash" -ForegroundColor Red
            exit 1
          }
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Generate changelog
        id: changelog
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $tdlibHash = "${{ steps.tdlib.outputs.hash }}"

          # 上一个 tag：预发布 tag 先截掉 -suffix 再按数值排序
          $prevTag = git tag --list "v*" |
            Where-Object { $_ -ne $tag -and $_ -match '^v\d+\.\d+\.\d+' } |
            Sort-Object -Property { [version]($_ -replace '^v', '' -replace '-.*$', '') } -Descending |
            Select-Object -First 1

          if ($prevTag) {
            Write-Host "上一个 tag: $prevTag"
            $commits = git log --pretty=format:"- %s (%h)" "$prevTag..HEAD"
          } else {
            Write-Host "没有之前的 tag，获取所有提交"
            $commits = git log --pretty=format:"- %s (%h)" HEAD
          }

          $body = "## TDEEEG $tag`n`n"
          $body += "### 构建信息`n`n"
          $body += "- 版本: ``$version``（跟随 tag）`n"
          $body += "- 架构: Windows ${{ runner.arch }}（安装包名带架构，如 ``tdeeeg_${version}_x64-setup.exe``）`n"
          $body += "- TDLib commit: ``$tdlibHash```n"
          $body += "- WebView2: 默认包在线安装 / ``-webview`` 包离线安装`n`n"
          if ($commits) {
            $body += "### 更新内容`n`n$($commits -join "`n")"
          } else {
            $body += "### 更新内容`n`n无提交记录"
          }

          Write-Host "--- Release Body ---"
          Write-Host $body

          Set-Content -Path "RELEASE_BODY.md" -Value $body -NoNewline
        shell: pwsh

      - name: Read changelog
        id: changelog_read
        run: |
          $body = Get-Content -Path "RELEASE_BODY.md" -Raw
          # 使用 delimiter 语法输出多行值
          echo "body<<EOF" >> $env:GITHUB_OUTPUT
          echo "$body" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Checkout TDlib
        run: |
          git clone https://github.com/tdlib/td.git
          cd td
          git checkout ${{ steps.tdlib.outputs.hash }}
        shell: pwsh

      # 缓存 TDlib 构建目录和安装目录（按 commit hash + OS + arch）
      - name: Cache TDlib build
        id: cache_tdlib
        uses: actions/cache@v3
        with:
          path: |
            td/build
            td/tdlib
          key: tdlib-${{ steps.tdlib.outputs.hash }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            tdlib-${{ steps.tdlib.outputs.hash }}-${{ runner.os }}-
            tdlib-${{ steps.tdlib.outputs.hash }}-

      # 如果缓存未命中，则执行完整的 TDlib 构建
      - name: Setup vcpkg (if cache miss)
        if: steps.cache_tdlib.outputs.cache-hit != 'true'
        run: |
          cd td
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          ./vcpkg.exe install gperf:x64-windows-static openssl:x64-windows-static zlib:x64-windows-static
        shell: pwsh

      - name: Build TDlib shared library (if cache miss)
        if: steps.cache_tdlib.outputs.cache-hit != 'true'
        run: |
          cd td
          Remove-Item build -Force -Recurse -ErrorAction SilentlyContinue
          mkdir build
          cd build
          cmake -A x64 `
            -DCMAKE_INSTALL_PREFIX:PATH=../tdlib `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DTD_ENABLE_OPENSSL_STATIC=ON `
            -DTD_ENABLE_ZLIB_STATIC=ON `
            -DBUILD_SHARED_LIBS=ON `
            ..
          cmake --build . --target install --config Release
        shell: pwsh

      - name: Copy TDlib.dll to src-tauri/bin
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          Copy-Item td/tdlib/bin/*.dll src-tauri/bin/ -Force
        shell: pwsh

      - name: Verify TDlib DLL
        run: |
          if (Test-Path src-tauri/bin/tdjson.dll) {
            Write-Host "tdjson.dll found in src-tauri/bin"
          } else {
            Write-Host "tdjson.dll NOT found!" -ForegroundColor Red
            exit 1
          }
        shell: pwsh

      - name: Stage TFLite runtime
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          $vendor = "src-tauri/langdetect/vendor/tensorflowlite_c.dll"
          if (Test-Path $vendor) {
            Copy-Item $vendor src-tauri/bin/tensorflowlite_c.dll -Force
            Write-Host "tensorflowlite_c.dll staged from vendor"
          } elseif (Test-Path src-tauri/bin/tensorflowlite_c.dll) {
            Write-Host "tensorflowlite_c.dll already in src-tauri/bin"
          } else {
            Write-Host "tensorflowlite_c.dll NOT found (vendor or bin)!" -ForegroundColor Red
            exit 1
          }
          if (-not (Test-Path public/language_detector.tflite)) {
            Write-Host "language_detector.tflite NOT found! (required by include_bytes)" -ForegroundColor Red
            exit 1
          }
          if (-not (Test-Path src-tauri/langdetect/Cargo.toml)) {
            Write-Host "src-tauri/langdetect crate NOT found!" -ForegroundColor Red
            exit 1
          }
        shell: pwsh

      - name: Apply version from tag
        run: |
          node scripts/set-version.mjs ${{ steps.version.outputs.tag }}
          git --no-pager diff --stat
        shell: pwsh

      - name: Build and release (default)
        id: tauri_build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "TDEEEG ${{ steps.version.outputs.tag }}"
          releaseBody: "${{ steps.changelog_read.outputs.body }}"
          releaseDraft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          # 不把 .sig 挂到 Release 资产（不影响 latest.json 生成）
          uploadUpdaterSignatures: false

      # 复用上一步已编译产物；应用名仍为 tdeeeg，仅安装包文件名加 -webview 后缀
      # webview 变体 createUpdaterArtifacts=false，无需 updater 签名
      - name: Bundle webview (offline WebView2) variant
        run: |
          if (-not (Test-Path "scripts/bundle-webview.ps1")) {
            Write-Host "scripts/bundle-webview.ps1 NOT found!" -ForegroundColor Red
            exit 1
          }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bundle-webview.ps1 -Mode WebviewOnly
          if ($LASTEXITCODE -ne 0) {
            Write-Host "bundle-webview.ps1 failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }
        shell: pwsh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}

      - name: Verify webview artifacts
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "webview" }
          if (-not $files -or $files.Count -eq 0) {
            Write-Host "No webview artifacts found!" -ForegroundColor Red
            Get-ChildItem "src-tauri/target/release/bundle/nsis" -ErrorAction SilentlyContinue | Format-Table Name, Length
            exit 1
          }
          $files | Format-Table Name, @{N = "SizeMB"; E = { [math]::Round($_.Length / 1MB, 2) } } -AutoSize
        shell: pwsh

      - name: Verify artifact naming (tag version + arch)
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $pattern = '^tdeeeg_' + [regex]::Escape($version) + '_(x64|arm64|i686)(-webview)?-setup\.exe$'
          $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -eq ".exe" -and $_.Name -like "tdeeeg_*" })
          if ($files.Count -eq 0) {
            Write-Host "bundle/nsis 下没有安装包，构建可能失败" -ForegroundColor Red
            exit 1
          }
          $bad = @($files | Where-Object { $_.Name -notmatch $pattern })
          if ($bad.Count -gt 0) {
            Write-Host "安装包名未跟随 tag 版本 $version（期望 tdeeeg_${version}_<arch>-setup.exe）：" -ForegroundColor Red
            $bad | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          $files | Sort-Object Name | Format-Table Name, @{N = "SizeMB"; E = { [math]::Round($_.Length / 1MB, 2) } } -AutoSize
        shell: pwsh

      - name: Upload webview artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*webview*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}