name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: true
        type: string
      release_type:
        description: '发布类型'
        required: true
        type: choice
        default: 'stable'
        options:
          - stable
          - prerelease
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $VERSION = "${{ github.event.inputs.version }}"
          } else {
            $VERSION = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Get release type
        id: release_type
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $TYPE = "${{ github.event.inputs.release_type }}"
          } else {
            $TYPE = "stable"
          }
          echo "type=$TYPE" >> $env:GITHUB_OUTPUT
          if ($TYPE -eq "prerelease") {
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "TDEEEG v${{ steps.version.outputs.version }}"
          releaseBody: "TDEEEG v${{ steps.version.outputs.version }}"
          releaseDraft: false
          prerelease: ${{ steps.release_type.outputs.prerelease }}
